# Local development database only. Production uses Neo4j AuraDB.
services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/skillpool-dev
    ports:
      - "127.0.0.1:17474:7474"
      - "127.0.0.1:17687:7687"
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
