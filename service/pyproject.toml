[project]
name = "skillpool"
version = "0.1.0"
description = "SkillPool service: ingestion, identity resolution, and search over a Neo4j graph"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "boto3",
    "fastapi",
    "neo4j",
    "openai",
    "pymupdf",
    "uvicorn",
]

[project.scripts]
skillpool = "skillpool.cli:main"

[dependency-groups]
dev = ["httpx", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skillpool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["neo4j: needs the local Neo4j from docker-compose.yml"]
