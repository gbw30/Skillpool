name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  service:
    runs-on: ubuntu-latest
    # The pipeline tests wipe the database they are pointed at, so they get a throwaway one.
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/skillpool-ci
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p skillpool-ci 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    env:
      SKILLPOOL_TEST_NEO4J_URI: bolt://127.0.0.1:7687
      SKILLPOOL_TEST_NEO4J_PASSWORD: skillpool-ci
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
